---
- name: Fetch Caddy SSL certificates for local installation
  hosts: nextcloud
  become: yes
  vars:
    nextcloud_base_dir: /opt/nextcloud
    caddy_data_dir: "{{ nextcloud_base_dir }}/caddy"
    nextcloud_domain: myhost.local
    local_cert_dir: "./certificates"
    
  tasks:
    - name: Check if Caddy is running
      shell: docker ps --filter "name=nextcloud-caddy" | grep -q nextcloud-caddy
      register: caddy_status
      changed_when: false
      failed_when: false
      
    - name: Fail if Caddy is not running
      fail:
        msg: "Caddy container is not running. Please start the Nextcloud stack first."
      when: caddy_status.rc != 0
    
    - name: Find Caddy certificate directory for domain
      find:
        paths: "{{ caddy_data_dir }}/data/caddy/certificates"
        file_type: directory
        recurse: yes
      register: cert_dirs
      
    - name: Display certificate directories found
      debug:
        msg: "Certificate directories: {{ cert_dirs.files | map(attribute='path') | list }}"
        
    - name: Find certificate files for myhost.local
      find:
        paths: "{{ caddy_data_dir }}/data/caddy/certificates"
        patterns: "*.crt,*.key,*.pem"
        recurse: yes
      register: cert_files
      
    - name: Create local certificates directory
      delegate_to: localhost
      become: no
      file:
        path: "{{ local_cert_dir }}"
        state: directory
        mode: '0755'
        
    - name: Fetch certificate files with myhost naming
      fetch:
        src: "{{ item.path }}"
        dest: "{{ local_cert_dir }}/myhost-{{ item.path | basename }}"
        flat: yes
      loop: "{{ cert_files.files }}"
      when: cert_files.files | length > 0
      
    - name: Find Caddy root CA certificate
      find:
        paths: "{{ caddy_data_dir }}/data/caddy/pki/authorities/local"
        patterns: "root.crt"
        recurse: yes
      register: root_ca
      
    - name: Fetch Caddy root CA certificate
      fetch:
        src: "{{ item.path }}"
        dest: "{{ local_cert_dir }}/myhost-caddy-root-ca.crt"
        flat: yes
      loop: "{{ root_ca.files }}"
      when: root_ca.files | length > 0
      
    - name: Create installation instructions
      delegate_to: localhost
      become: no
      copy:
        content: |
          # Myhost Nextcloud SSL Certificate Installation Instructions
          
          Certificate files have been downloaded to: {{ local_cert_dir }}/
          
          ## For {{ nextcloud_domain }}
          
          ### Installing Root CA Certificate:
          
          The most important file is: **myhost-caddy-root-ca.crt**
          Install this on your devices to trust all Caddy-generated certificates for myhost.local.
          
          #### Windows:
          1. Double-click myhost-caddy-root-ca.crt
          2. Click "Install Certificate"
          3. Choose "Local Machine"
          4. Select "Place all certificates in the following store"
          5. Browse and select "Trusted Root Certification Authorities"
          6. Click OK and Finish
          
          #### macOS:
          1. Double-click myhost-caddy-root-ca.crt
          2. Add to "System" keychain
          3. Open Keychain Access
          4. Find "Caddy Local Authority"
          5. Double-click and set to "Always Trust"
          
          #### Linux (Ubuntu/Debian):
          ```bash
          sudo cp myhost-caddy-root-ca.crt /usr/local/share/ca-certificates/myhost-caddy-root-ca.crt
          sudo update-ca-certificates
          ```
          
          #### iOS:
          1. Email the myhost-caddy-root-ca.crt to yourself
          2. Open on iPhone/iPad
          3. Go to Settings > General > VPN & Device Management
          4. Install the profile
          5. Go to Settings > General > About > Certificate Trust Settings
          6. Enable full trust for the Caddy root CA
          
          #### Android:
          1. Copy myhost-caddy-root-ca.crt to device
          2. Settings > Security > Install from storage
          3. Select the certificate file
          4. Name it "Myhost Caddy Local CA"
          5. Select "VPN and apps" usage
          
          #### Firefox (uses own certificate store):
          1. Open Firefox
          2. Settings > Privacy & Security > Certificates > View Certificates
          3. Import myhost-caddy-root-ca.crt
          4. Trust for websites
          
          ---
          Generated: {{ ansible_date_time.iso8601 }}
          
          All certificate files are prefixed with "myhost-" for easy identification.
        dest: "{{ local_cert_dir }}/INSTALL-INSTRUCTIONS.txt"
        mode: '0644'
        
    - name: Display summary
      delegate_to: localhost
      debug:
        msg:
          - "✓ Certificates fetched successfully!"
          - "Location: {{ local_cert_dir }}/"
          - ""
          - "Next steps:"
          - "1. Review files in {{ local_cert_dir }}/"
          - "2. Install myhost-caddy-root-ca.crt on your devices"
          - "3. Read INSTALL-INSTRUCTIONS.txt for platform-specific steps"
          - ""
          - "Important: Install the ROOT CA certificate (myhost-caddy-root-ca.crt)"
          - "This allows all devices to trust certificates from your myhost Caddy server"
