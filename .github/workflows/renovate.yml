name: Renovate

on:
  schedule:
    - cron: '0 5 * * *' # Every day at 05:00 UTC
  workflow_dispatch: # manual run: Actions -> Renovate -> Run workflow

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      # Runs the Renovate container. RENOVATE_TOKEN is a repository secret (see README).
      - uses: renovatebot/github-action@v46.3.15
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Commit author. Not Renovate's default (a Mend-owned address). Override with the repository variable RENOVATE_GIT_AUTHOR.
          RENOVATE_GIT_AUTHOR: ${{ vars.RENOVATE_GIT_AUTHOR || format('Renovate Bot <{0}@users.noreply.github.com>', github.repository_owner) }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          LOG_LEVEL: info
