name: Renovate

on:
  schedule:
    - cron: '0 5 * * 1' # Mondays 05:00 UTC
  workflow_dispatch: # manual run: Actions -> Renovate -> Run workflow

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      # Runs the Renovate container. RENOVATE_TOKEN is a repository secret (see README).
      - uses: renovatebot/github-action@v46.3.14
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          LOG_LEVEL: info
