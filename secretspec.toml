[project]
name = "homelab"
revision = "1.0"

# Every credential of the stack. The names are the environment variables that `./run.sh` passes to
# Ansible (`secretspec run --profile <environment> -- ansible-playbook ...`); playbooks/group_vars/all/defaults.yml
# turns them into the Ansible variables (mysql_password, ...). The VALUES are never in the repo: each profile
# (prod, dev) stores its own in the provider chain below. `homelab` is a provider ALIAS that each user defines in their
# own config (the path to their .kdbx is machine-specific, so it is not in this file):
#   secretspec config global provider add homelab 'kdbx:/abs/path/homelab.kdbx' --credential password=keyring://
#   secretspec config provider login homelab      # stores the KeePass master password in the keyring
#
# Default provider chain for every profile (needs SecretSpec 0.21+). There is no project-level default PROFILE:
# ./run.sh always passes --profile <environment>; for other commands pass --profile or set SECRETSPEC_PROFILE.
[defaults]
providers = ["homelab"]

#
# Passwords: letters and digits only for MYSQL_PASSWORD (it is also the Redis password); the others may use most
# printable characters except space $ # ' " ` \ (deploy.yml checks). Generate one with:
#   openssl rand -base64 24 | tr -dc 'A-Za-z0-9'
[profiles.default]
# MariaDB
MYSQL_USER = { description = "MariaDB user for Nextcloud and Nginx Proxy Manager", required = false, default = "nextcloud" }
MYSQL_PASSWORD = { description = "MariaDB password of that user; also the Redis password (letters and digits only)", required = true }
MYSQL_ROOT_PASSWORD = { description = "MariaDB root password", required = true }

# Nextcloud
NEXTCLOUD_ADMIN_USER = { description = "Nextcloud admin user (created on first install)", required = false, default = "admin" }
NEXTCLOUD_ADMIN_PASSWORD = { description = "Nextcloud admin password (created on first install)", required = true }

# Nginx Proxy Manager (first start only)
NGINX_ADMIN_EMAIL = { description = "Nginx Proxy Manager initial admin login (an email)", required = true }
NGINX_ADMIN_PASSWORD = { description = "Nginx Proxy Manager initial admin password", required = true }

# One profile per environment (inventory/<environment>): same secrets as default, with their own values.
# Use different values in dev and prod.
[profiles.prod]

[profiles.dev]
