---
- name: Deploy Nextcloud stack
  hosts: nextcloud
  become: yes
  vars:
    nextcloud_base_dir: /opt/nextcloud
    nextcloud_data_dir: "{{ nextcloud_base_dir }}/app"
    mariadb_data_dir: "{{ nextcloud_base_dir }}/db"
    redis_data_dir: "{{ nextcloud_base_dir }}/redis"
    nginx_data_dir: "{{ nextcloud_base_dir }}/nginx-proxy-manager"
    netdata_data_dir: "{{ nextcloud_base_dir }}/netdata"
    nextcloud_domain: "nextcloud.example.com"
    nextcloud_port: 8080
    
    # Clean install: Set to true to remove all volumes and recreate (useful for development)
    # Set to false to preserve data and just update containers/configs (useful for updates)
    clean_install: false
    
    # Credentials (customize these)
    mysql_root_password: "{{ lookup('env', 'MYSQL_ROOT_PASSWORD') | default('changeme_root_password', true) }}"
    mysql_database: nextcloud
    mysql_user: nextcloud
    mysql_password: "{{ lookup('env', 'MYSQL_PASSWORD') | default('changeme_mysql_password', true) }}"
    nextcloud_admin_user: admin
    nextcloud_admin_password: "{{ lookup('env', 'NEXTCLOUD_ADMIN_PASSWORD') | default('changeme_admin_password', true) }}"
    nginx_admin_email: "{{ lookup('env', 'NGINX_ADMIN_EMAIL') | default('changeme@email.com', true) }}"
    nginx_admin_password: "{{ lookup('env', 'NGINX_ADMIN_PASSWORD') | default('changeme_admin_password', true) }}"

  tasks:
    - name: Install required packages
      apt:
        name:
          - docker.io
          - docker-compose
          - libnss3-tools
          - tree
          - neovim
        state: present
        update_cache: yes

    - name: Ensure Docker service is running
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add ansible user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Stop existing Docker Compose stack (remove volumes)
      command:
        cmd: docker-compose down -v
        chdir: "{{ nextcloud_base_dir }}"
      ignore_errors: yes
      when: clean_install | bool

    - name: Stop existing Docker Compose stack (preserve volumes)
      command:
        cmd: docker-compose down
        chdir: "{{ nextcloud_base_dir }}"
      ignore_errors: yes
      when: not (clean_install | bool)

    - name: Remove Nextcloud base directory (clean install only)
      file:
        path: "{{ nextcloud_base_dir }}"
        state: absent
      when: clean_install | bool

    - name: Ensure base directories exist
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ nextcloud_data_dir }}"
        - "{{ mariadb_data_dir }}"
        - "{{ redis_data_dir }}"
        - "{{ nginx_data_dir }}"
        - "{{ netdata_data_dir }}/config"
        - "{{ netdata_data_dir }}/lib"
        - "{{ netdata_data_dir }}/cache"

    - name: Deploy .env file
      template:
        src: .env.j2
        dest: "{{ nextcloud_base_dir }}/.env"
        mode: '0600'

    - name: Deploy docker-compose.yml
      template:
        src: docker-compose.yml.j2
        dest: "{{ nextcloud_base_dir }}/docker-compose.yml"
        mode: '0644'

    - name: Deploy Apache HSTS configuration
      template:
        src: apache-hsts.conf.j2
        dest: "{{ nextcloud_base_dir }}/apache-hsts.conf"
        mode: '0644'

    - name: Create systemd service for Nextcloud stack
      copy:
        content: |
          [Unit]
          Description=Nextcloud Docker Compose Stack
          Requires=docker.service
          After=docker.service network-online.target
          Wants=network-online.target
          
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          WorkingDirectory={{ nextcloud_base_dir }}
          ExecStart=/usr/bin/docker-compose up -d
          ExecStop=/usr/bin/docker-compose down
          TimeoutStartSec=300
          TimeoutStopSec=120
          
          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/nextcloud-stack.service
        mode: '0644'

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes

    - name: Enable Nextcloud stack service
      systemd:
        name: nextcloud-stack
        enabled: yes

    - name: Start Nextcloud stack service
      systemd:
        name: nextcloud-stack
        state: started
      register: docker_compose_output

    - name: Create occ helper script
      copy:
        content: |
          #!/bin/bash
          # Nextcloud occ command helper
          docker exec -u www-data nextcloud-app php occ "$@"
        dest: /usr/local/bin/nextcloud-occ
        mode: '0755'

    - name: Wait for Nextcloud container to be healthy
      shell: docker inspect --format='{{"{{.State.Health.Status}}"}}' nextcloud-app
      register: health_check
      until: health_check.stdout == "healthy"
      retries: 60
      delay: 5
      changed_when: false

    - name: Wait for Nextcloud to be fully installed
      command: /usr/local/bin/nextcloud-occ status --output=json
      register: nextcloud_status
      until: >
        nextcloud_status.rc == 0 and
        (nextcloud_status.stdout | from_json).installed == true
      retries: 30
      delay: 5
      changed_when: false

    - name: Add missing MIME types to Nextcloud
      command: /usr/local/bin/nextcloud-occ maintenance:repair --include-expensive
      register: occ_output
      changed_when: false
      failed_when: false

    - name: Add Nextcloud missing database indices
      command: /usr/local/bin/nextcloud-occ db:add-missing-indices
      register: occ_indices_output
      changed_when: false
      failed_when: false

    - name: Add Nextcloud maintenance window
      command: /usr/local/bin/nextcloud-occ config:system:set maintenance_window_start --type=integer --value=1
      register: occ_output
      changed_when: false
      failed_when: false

    - name: Disable Nextcloud demo files for new users
      command: /usr/local/bin/nextcloud-occ config:system:set skeletondirectory --value=''
      register: occ_output
      changed_when: false
      failed_when: false

    - name: Configure Nextcloud HSTS header
      command: /usr/local/bin/nextcloud-occ config:system:set overwrite.cli.url --value="https://{{ nextcloud_domain }}"
      changed_when: false
      failed_when: false

    - name: Disable Nextcloud first run wizard
      command: /usr/local/bin/nextcloud-occ config:app:set --value false firstrunwizard wizard_enabled
      changed_when: false
      failed_when: false

    - name: Enable Apache HSTS configuration
      command: docker exec nextcloud-app a2enconf hsts
      changed_when: false
      failed_when: false

    - name: Reload Apache in Nextcloud container
      command: docker exec nextcloud-app apache2ctl graceful
      changed_when: false
      failed_when: false
    #
    - name: Display deployment information
      debug:
        msg:
          - "Nextcloud has been deployed successfully!"
          - "Access Nextcloud at: https://{{ nextcloud_domain }}"
          - "Admin username: {{ nextcloud_admin_user }}"
          - "Please check the .env file for credentials at {{ nextcloud_base_dir }}/.env"
          - ""
          - "To run occ commands, use: nextcloud-occ <command>"
          - "Example: nextcloud-occ maintenance:mode --on"
