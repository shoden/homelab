---
- name: Deploy Nextcloud stack
  hosts: nextcloud
  become: yes
  # Settings come from group_vars/all/defaults.yml (project defaults) and from
  # inventory/group_vars/nextcloud/{main,vault}.yml (your site; see inventory.example/).
  pre_tasks:
    - name: Check required settings are provided
      assert:
        that:
          - (lookup('vars', item, default='') | string | length) > 0
          - not (lookup('vars', item, default='') | string is search('CHANGE_ME|changeme|example\\.(com|org)'))
        fail_msg: "'{{ item }}' is missing or still a placeholder. Set it in inventory/group_vars/nextcloud/ (see inventory.example/)."
        quiet: true
      loop:
        - nextcloud_domain
        - nginx_admin_email
        - mysql_root_password
        - mysql_password
        - nextcloud_admin_password
        - nginx_admin_password
      tags: always

  tasks:
    - name: Install required packages
      apt:
        name:
          - docker.io
          - docker-compose
          - libnss3-tools
          - tree
          - neovim
        state: present
        update_cache: yes
        cache_valid_time: 3600

    - name: Ensure Docker service is running
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add ansible user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Stop existing Docker Compose stack and remove volumes (clean install only)
      command:
        cmd: docker-compose down -v
        chdir: "{{ nextcloud_base_dir }}"
      ignore_errors: yes
      when: clean_install | bool

    - name: Remove Nextcloud base directory (clean install only)
      file:
        path: "{{ nextcloud_base_dir }}"
        state: absent
      when: clean_install | bool

    - name: Ensure base directories exist
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ nextcloud_data_dir }}"
        - "{{ mariadb_data_dir }}"
        - "{{ redis_data_dir }}"
        - "{{ nginx_data_dir }}"
        - "{{ netdata_data_dir }}/config"
        - "{{ netdata_data_dir }}/lib"
        - "{{ netdata_data_dir }}/cache"

    - name: Deploy .env file
      template:
        src: .env.j2
        dest: "{{ nextcloud_base_dir }}/.env"
        mode: '0600'
      register: env_file

    - name: Deploy docker-compose.yml
      template:
        src: docker-compose.yml.j2
        dest: "{{ nextcloud_base_dir }}/docker-compose.yml"
        mode: '0644'
      register: compose_file

    - name: Deploy Apache HSTS configuration
      template:
        src: apache-hsts.conf.j2
        dest: "{{ nextcloud_base_dir }}/apache-hsts.conf"
        mode: '0644'
      register: hsts_file

    - name: Create systemd service for Nextcloud stack
      copy:
        content: |
          [Unit]
          Description=Nextcloud Docker Compose Stack
          Requires=docker.service
          After=docker.service network-online.target
          Wants=network-online.target
          
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          WorkingDirectory={{ nextcloud_base_dir }}
          ExecStart=/usr/bin/docker-compose up -d
          ExecStop=/usr/bin/docker-compose down
          TimeoutStartSec=300
          TimeoutStopSec=120
          
          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/nextcloud-stack.service
        mode: '0644'
      register: unit_file

    - name: Determine whether the stack must be restarted
      set_fact:
        stack_config_changed: "{{ [env_file, compose_file, hsts_file, unit_file] | select('changed') | list | length > 0 }}"

    # New image tags (e.g. from a merged Renovate PR) are downloaded while the old stack is still
    # running, so the downtime is only the restart and the systemd start timeout (300s) is not
    # spent on slow pulls. Pulling can be slow on a small host, hence the 30 minute task timeout.
    - name: Pull container images (configuration changed)
      command: docker-compose pull
      args:
        chdir: "{{ nextcloud_base_dir }}"
      timeout: 1800
      when: stack_config_changed | bool

    # Only restart when a deployed file changed; otherwise the run causes no downtime.
    - name: Restart Nextcloud stack (configuration changed)
      systemd:
        name: nextcloud-stack
        state: restarted
        daemon_reload: yes
      when: stack_config_changed | bool

    - name: Ensure Nextcloud stack service is enabled and running
      systemd:
        name: nextcloud-stack
        enabled: yes
        state: started

    - name: Create occ helper script
      copy:
        content: |
          #!/bin/bash
          # Nextcloud occ command helper
          docker exec -u www-data nextcloud-app php occ "$@"
        dest: /usr/local/bin/nextcloud-occ
        mode: '0755'

    - name: Wait for Nextcloud container to be healthy
      shell: docker inspect --format='{{"{{.State.Health.Status}}"}}' nextcloud-app
      register: health_check
      until: health_check.stdout == "healthy"
      retries: 60
      delay: 5
      changed_when: false

    - name: Wait for Nextcloud to be fully installed
      command: /usr/local/bin/nextcloud-occ status --output=json
      register: nextcloud_status
      until: >
        nextcloud_status.rc == 0 and
        (nextcloud_status.stdout | from_json).installed == true
      retries: 30
      delay: 5
      changed_when: false

    # Slow on large instances: only after a restart (e.g. image upgrade) or with -e run_repair=true
    - name: Run Nextcloud repair including expensive steps (adds missing MIME types)
      command: /usr/local/bin/nextcloud-occ maintenance:repair --include-expensive
      failed_when: false
      when: stack_config_changed | bool or run_repair | bool

    - name: Add Nextcloud missing database indices
      command: /usr/local/bin/nextcloud-occ db:add-missing-indices
      failed_when: false
      when: stack_config_changed | bool or run_repair | bool

    - name: Read current Nextcloud system config
      command: /usr/local/bin/nextcloud-occ config:system:get {{ item.key }}
      loop: "{{ nextcloud_system_config }}"
      loop_control:
        label: "{{ item.key }}"
      register: system_config_current
      changed_when: false
      failed_when: false

    - name: Set Nextcloud system config
      command: >-
        /usr/local/bin/nextcloud-occ config:system:set {{ item.item.key }}
        --value={{ item.item.value | string | quote }}
        {% if item.item.type is defined %}--type={{ item.item.type }}{% endif %}
      loop: "{{ system_config_current.results }}"
      loop_control:
        label: "{{ item.item.key }}"
      when: item.rc != 0 or item.stdout != (item.item.value | string)

    - name: Read first run wizard setting
      command: /usr/local/bin/nextcloud-occ config:app:get firstrunwizard wizard_enabled
      register: firstrunwizard_current
      changed_when: false
      failed_when: false

    - name: Disable Nextcloud first run wizard
      command: /usr/local/bin/nextcloud-occ config:app:set --value false firstrunwizard wizard_enabled
      when: firstrunwizard_current.rc != 0 or firstrunwizard_current.stdout != 'false'

    - name: Display deployment information
      debug:
        msg:
          - "Nextcloud has been deployed successfully!"
          - "Access Nextcloud at: https://{{ nextcloud_domain }}"
          - "Admin username: {{ nextcloud_admin_user }}"
          - "Please check the .env file for credentials at {{ nextcloud_base_dir }}/.env"
          - ""
          - "To run occ commands, use: nextcloud-occ <command>"
          - "Example: nextcloud-occ maintenance:mode --on"
