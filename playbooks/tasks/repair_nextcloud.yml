---
# Repair Nextcloud and add missing database indices, without ever leaving maintenance mode switched on.
# Needs nextcloud_ready from wait_nextcloud.yml (run it first).
#
# `occ maintenance:repair` turns maintenance mode on and restores the previous value only if it runs to
# the end. If it is interrupted, or fails (for example on half-upgraded code), Nextcloud stays in
# maintenance mode. So restore it here, whatever happens.
- name: Repair Nextcloud
  block:
    - name: Run Nextcloud repair including expensive steps (adds missing MIME types)
      command: "{{ occ }} maintenance:repair --include-expensive"
      register: nextcloud_repair
      failed_when: false

    - name: Add Nextcloud missing database indices
      command: "{{ occ }} db:add-missing-indices"
      register: nextcloud_indices
      failed_when: false
  always:
    - name: Switch maintenance mode off again (only if it was off before the repair)
      command: "{{ occ }} maintenance:mode --off"
      register: maintenance_off
      changed_when: "'already' not in maintenance_off.stdout"
      when: not nextcloud_ready.maintenance

    - name: Warn about a repair or index step that failed
      debug:
        msg:
          - "WARNING: '{{ item.cmd | join(' ') | regex_replace('^.*php occ ', '') }}' failed (rc={{ item.rc }}). Run it by hand: {{ occ_helper | basename }} {{ item.cmd | join(' ') | regex_replace('^.*php occ ', '') }}"
          - "{{ (item.stderr_lines | default([]))[-3:] }}"
      loop: "{{ [nextcloud_repair | default({}), nextcloud_indices | default({})] }}"
      loop_control:
        label: "{{ item.cmd | default([]) | join(' ') | regex_replace('^.*php occ ', '') }}"
      when: item.rc | default(0) != 0
