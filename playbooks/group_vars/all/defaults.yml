---
# Project defaults. Do not put site-specific values here: override them in
# inventory/<env>/group_vars/nextcloud/main.yml (see inventory.example/).
# group_vars/nextcloud (inventory) beats group_vars/all (here), so use that group.

# --- Environments -------------------------------------------------------------------------------
# Every inventory (inventory/prod, inventory/dev, ...) sets `stack_env` (REQUIRED, no default on purpose).
# It labels the environment (messages, backup manifest); it does NOT change any name. Each environment
# runs on its own host, so every one uses the same fixed names (nextcloud, nextcloud-app, /opt/nextcloud, ...).
stack_name: nextcloud
container_app: "{{ stack_name }}-app"
container_db: "{{ stack_name }}-mariadb"
container_redis: "{{ stack_name }}-redis"
container_proxy: "{{ stack_name }}-proxy"
container_node_exporter: "{{ stack_name }}-node-exporter"
container_metrics: "{{ stack_name }}-victoria-metrics"
container_vmalert: "{{ stack_name }}-vmalert"
container_alertmanager: "{{ stack_name }}-alertmanager"
container_grafana: "{{ stack_name }}-grafana"
stack_service: "{{ stack_name }}-stack"                # systemd unit
occ_helper: "/usr/local/bin/{{ stack_name }}-occ"   
occ: "docker exec -u www-data {{ container_app }} php occ"

# The reverse proxy (Nginx Proxy Manager: ports 80, 443, 81) is deployed in every
# environment. Each environment is meant to run on its own host: two stacks that both enable it cannot share
# one (the ports clash). Set it to false in an inventory to leave it out.
with_proxy: true

# --- Monitoring ---------------------------------------------------------------------------------------------
# with_node_exporter: every environment exposes its host's metrics (node_exporter, port 9100 on the LAN: do not
# forward it to the internet; restrict it to the hub with a firewall or set node_exporter_listen to the LAN address).
# with_monitoring_hub: ONE environment (here: dev) also runs VictoriaMetrics + vmalert + Alertmanager (Telegram) +
# Grafana and scrapes every address in monitoring_targets. The hub needs with_proxy (Grafana is served at grafana_domain).
with_node_exporter: true
node_exporter_listen: "0.0.0.0:9100"
with_monitoring_hub: false
monitoring_dir: "{{ nextcloud_base_dir }}/monitoring"
monitoring_retention: 30d
monitoring_scrape_interval: 30s
# Hub only, in the inventory: [{ name: dev, address: "192.168.1.10:9100" }, { name: prod, address: "192.168.1.11:9100" }]
monitoring_targets: []

nextcloud_base_dir: "/opt/{{ stack_name }}"
nextcloud_data_dir: "{{ nextcloud_base_dir }}/app"
mariadb_data_dir: "{{ nextcloud_base_dir }}/db"
redis_data_dir: "{{ nextcloud_base_dir }}/redis"
nginx_data_dir: "{{ nextcloud_base_dir }}/nginx-proxy-manager"

timezone: UTC

mysql_database: nextcloud

# Credentials come from SecretSpec (secretspec.toml), which `./run.sh` injects as environment variables
# (`secretspec run --profile <environment> -- ansible-playbook ...`). lookup('env') runs on the machine you
# deploy from. A missing secret ends up empty and the pre_tasks asserts in deploy.yml stop the run.
mysql_user: "{{ lookup('ansible.builtin.env', 'MYSQL_USER') }}"
mysql_password: "{{ lookup('ansible.builtin.env', 'MYSQL_PASSWORD') }}"
mysql_root_password: "{{ lookup('ansible.builtin.env', 'MYSQL_ROOT_PASSWORD') }}"
nextcloud_admin_user: "{{ lookup('ansible.builtin.env', 'NEXTCLOUD_ADMIN_USER') }}"
nextcloud_admin_password: "{{ lookup('ansible.builtin.env', 'NEXTCLOUD_ADMIN_PASSWORD') }}"
nginx_admin_email: "{{ lookup('ansible.builtin.env', 'NGINX_ADMIN_EMAIL') }}"
nginx_admin_password: "{{ lookup('ansible.builtin.env', 'NGINX_ADMIN_PASSWORD') }}"
nextcloud_test_user: "{{ lookup('ansible.builtin.env', 'NEXTCLOUD_TEST_USER') }}"
nextcloud_test_password: "{{ lookup('ansible.builtin.env', 'NEXTCLOUD_TEST_PASSWORD') }}"
ovh_application_key: "{{ lookup('ansible.builtin.env', 'OVH_APPLICATION_KEY') }}"
ovh_application_secret: "{{ lookup('ansible.builtin.env', 'OVH_APPLICATION_SECRET') }}"
ovh_consumer_key: "{{ lookup('ansible.builtin.env', 'OVH_CONSUMER_KEY') }}"
grafana_admin_password: "{{ lookup('ansible.builtin.env', 'GRAFANA_ADMIN_PASSWORD') }}"
telegram_bot_token: "{{ lookup('ansible.builtin.env', 'TELEGRAM_BOT_TOKEN') }}"
telegram_chat_id: "{{ lookup('ansible.builtin.env', 'TELEGRAM_CHAT_ID') }}"

# --- End-to-end test (tasks/test_account.yml creates the account, tasks/e2e.yml runs e2e/ with Playwright) ----
# Directory of the Playwright project, on the machine you deploy from
e2e_dir: "{{ playbook_dir }}/../e2e"
# true: change the test account's password to the current NEXTCLOUD_TEST_PASSWORD (an existing account keeps its
# password otherwise)
e2e_reset_password: false
# true: show the browser while the end-to-end test runs (needs a display on the machine you deploy from).
# e2e_slow_mo: milliseconds to pause after each action when watching (empty = 400 when headed, 0 otherwise)
e2e_headed: false
e2e_slow_mo: ""
# e2e_telegram_alert: on failure, send a Telegram message (needs the TELEGRAM_* secrets in this environment's profile)
e2e_telegram_alert: true
# deploy_telegram_notify: deploy.yml tells Telegram when it finishes, succeeded or failed (tasks/audit_deploy.yml)
deploy_telegram_notify: true

# --- Nginx Proxy Manager, configured through its API by tasks/npm.yml (only when with_proxy) ------------------
# Required in the inventory (no defaults): npm_certificate_domains (comma separated, e.g.
# "dev.example.org,*.dev.example.org": one Let's Encrypt certificate for all of them), and proxy_domain. nextcloud_domain is the Nextcloud proxy host.
ovh_endpoint: ovh-eu
# Seconds NPM waits for the DNS TXT record to propagate; empty = NPM's default
npm_dns_propagation_seconds: ""
npm_api: "http://127.0.0.1:81/api"
# true shows the NPM API requests in the output, INCLUDING tokens and the OVH credentials (-e npm_debug=true)
npm_debug: false
# One proxy host per entry; they all use the certificate above, Force SSL, HTTP/2 and websockets
npm_proxy_hosts:
  - { domain: "{{ nextcloud_domain }}", host: "{{ container_app }}", port: 80 }
  - { domain: "{{ proxy_domain }}", host: "{{ container_proxy }}", port: 81 }
npm_proxy_hosts_grafana:
  - { domain: "{{ grafana_domain | default('') }}", host: "{{ container_grafana }}", port: 3000 }
nextcloud_port: 8080

# Clean install: true removes all volumes and /opt/nextcloud (development only).
# false preserves data and just updates containers/configs.
clean_install: false

# Run the slow "maintenance:repair --include-expensive" and missing-index steps
# even when the stack was not restarted (they always run after a restart)
run_repair: false

# Nextcloud config.php settings, applied only when they differ from the current value
nextcloud_system_config:
  - { key: maintenance_window_start, value: "1", type: integer }
  - { key: skeletondirectory, value: "" }                          # no demo files for new users
  - { key: overwrite.cli.url, value: "https://{{ nextcloud_domain }}" }

# Backups (backup.yml / restore.yml)
# Outside nextcloud_base_dir on purpose: clean_install deletes the base directory.
backup_dir: "/var/backups/{{ stack_name }}"
# How many completed backups to keep; older ones are removed after each new backup (minimum 1).
backup_keep: 3
# Also back up the user files (nextcloud_data_dir/data). Can be many GB and slow; an upgrade does not touch them.
backup_include_data: false
# Internal, set by restore.yml for its safety snapshot: name suffix and whether to prune old backups.
backup_suffix: ""
backup_prune: true

# restore.yml
# Take a safety backup of the current state before restoring over it.
pre_restore_backup: true
# Skip the typed confirmation (for non-interactive runs).
confirm_restore: false
# Allow restoring a backup made in another environment (it replaces this one's data and passwords).
restore_allow_other_env: false
# Rescan all user files after the restore. Slow on large instances; needed if files changed since the backup.
restore_files_scan: false
